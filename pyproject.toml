[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimesh-optimizer"
version = "0.1.0"
description = "LAN-only HTTP service that triggers Asus AiMesh optimize"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "asusrouter>=1.21.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
aimesh-optimizer = "aimesh_optimizer.__main__:main"

[tool.setuptools.packages.find]
include = ["aimesh_optimizer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
